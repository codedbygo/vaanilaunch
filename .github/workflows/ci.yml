name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest==9.0.2 pytest-cov==7.0.0
      - name: Tests (fails below 100% line and branch coverage)
        run: python -m pytest -q tests --cov=app --cov-branch --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format, lint, typecheck, tests (fails below 100% coverage)
        run: npm run check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vaanilaunch:ci .
      - name: Production refuses to start without its settings
        run: |
          set +e
          docker run --rm -e APP_ENV=production vaanilaunch:ci > out.log 2>&1
          grep -q "Refusing to start in production" out.log
